# Perfil prod (Docker / VPS) — ativado com QUARKUS_PROFILE=prod
# Obrigatório no deploy: ADMIN_API_KEY, CSRF_SECRET (ver docker-compose.yml)

framework.security.admin-api-key=${ADMIN_API_KEY:}
framework.security.admin-api-key-required=true
framework.security.csrf-secret=${CSRF_SECRET:}
framework.security.csrf-enabled=true
framework.security.sensitive-apis-enabled=true
framework.security.rate-limit-enabled=true
framework.security.rate-limit-per-minute=120
framework.security.rate-limit-heavy-per-minute=30
# Atrás de proxy TLS (Nginx) — cookies só via HTTPS
framework.security.cookie-secure=true

# HSTS: só no perfil de produção, porque o site está atrás de TLS (Cloudflare +
# Nginx). Instrui o browser a nunca mais tentar HTTP neste domínio, fechando a
# janela de downgrade no primeiro acesso de cada sessão.
# Sem includeSubDomains para não afetar outros subdomínios de carminati.dev.br.
quarkus.http.header."Strict-Transport-Security".value=max-age=31536000

framework.telemetry.enabled=true
framework.telemetry.dashboard-enabled=true
framework.telemetry.max-events=500
framework.telemetry.jsonl-max-bytes=10485760

# Proxy reverso (Nginx Proxy Manager / similar)
# Só o proxy reverso pode reescrever o IP de origem. Sem esta lista, o Quarkus
# aceita X-Forwarded-For de qualquer um e o rate limit vira decorativo: basta o
# cliente variar o cabeçalho para ganhar um balde novo a cada requisição.
# 172.22.0.0/16 é a nginx-proxy-network (infra-proxy-app-1 = 172.22.0.3).
quarkus.http.proxy.trusted-proxies=172.22.0.0/16
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-forwarded=true
quarkus.http.proxy.enable-forwarded-host=true
quarkus.http.proxy.enable-forwarded-prefix=true

# Dados persistentes (volume /deployments/data)
framework.logs.base-dir=/deployments/data/logs
quarkus.log.file.path=/deployments/data/logs/framework-net.log
framework.geo.database-path=/deployments/data/geo/GeoLite2-City.mmdb

# Login da Telemetria pelo GitHub. O callback tem de bater EXATAMENTE com o
# registrado na OAuth App, senão o GitHub responde redirect_uri_mismatch.
framework.security.github-oauth.client-id=${GITHUB_OAUTH_CLIENT_ID:}
framework.security.github-oauth.client-secret=${GITHUB_OAUTH_CLIENT_SECRET:}
framework.security.github-oauth.logins-permitidos=${GITHUB_OAUTH_LOGINS_PERMITIDOS:}
framework.security.github-oauth.callback-url=${GITHUB_OAUTH_CALLBACK_URL:https://frameworknet.carminati.dev.br/login/github/callback}

# --- Sincronizacao do dataset publico com o GitHub ---
# Token fine-grained com escopo Contents:write em UM unico repositorio.
# Optional no codigo: ausente = botao desabilitado, aplicacao sobe normal.
framework.dataset.github.token=${GITHUB_DATASET_TOKEN:}
framework.dataset.github.repositorio=${GITHUB_DATASET_REPO:carmipa/framework-net-telemetry-dataset}
framework.dataset.github.branch=${GITHUB_DATASET_BRANCH:main}
