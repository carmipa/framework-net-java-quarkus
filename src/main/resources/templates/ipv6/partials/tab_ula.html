{! Aba "ULA": gera um prefixo fd00::/8 pseudo-aleatório (RFC 4193) — o "IP privado" do IPv6. !}
<div class="row g-4">
    <div class="col-lg-4">
        <div class="calc-form-card">
            <h6 class="calc-form-title"><span class="material-symbols-outlined">vpn_lock</span> Gerador de ULA (RFC 4193)</h6>
            <p class="calc-hint">O "IP privado do IPv6": um prefixo fd00::/8 único para uso interno.</p>
            <form id="formUla" hx-post="/ipv6/api/ula" hx-target="#saidaUla" hx-swap="innerHTML"
                  hx-disabled-elt="find button[type='submit']">
                <div class="mb-3">
                    <label for="ipv6Sid" class="form-label text-secondary"><span class="material-symbols-outlined" aria-hidden="true">tag</span> Subnet ID <span class="text-muted">(opcional, 0–65535)</span></label>
                    <input type="text" class="aed-input form-control input-numeric" id="ipv6Sid" name="subnetId"
                           inputmode="numeric" placeholder="0" value="0" autocomplete="off" spellcheck="false">
                </div>
                <button type="submit" class="aed-btn aed-btn-execute w-100" title="Gerar um prefixo ULA pseudo-aleatório"><span class="spinner-border spinner-border-sm htmx-indicator" role="status" aria-hidden="true"></span><span class="material-symbols-outlined">casino</span> Gerar ULA</button>
                <button type="button" class="aed-btn aed-btn-neutral w-100 mt-2" data-limpar title="Esvaziar o campo e apagar o resultado"><span class="material-symbols-outlined">delete_sweep</span> Limpar</button>
            </form>
        </div>
    </div>
    <div class="col-lg-8">
        <div id="saidaUla" class="calc-saida">
            <div class="calc-placeholder"><span class="material-symbols-outlined" aria-hidden="true">vpn_lock</span><p class="mb-0">Gere um prefixo ULA pseudo-aleatório (fd00::/8) com Global ID de 40 bits e um Subnet ID.</p></div>
        </div>
    </div>
</div>
