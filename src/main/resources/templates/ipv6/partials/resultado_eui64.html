<div class="calc-resultado">
    <div class="calc-resumo-head">
        <h5 class="mb-1"><span class="material-symbols-outlined text-info" aria-hidden="true">badge</span> EUI-64 / SLAAC</h5>
    </div>
    <div class="calc-kpis">
        <div class="calc-kpi calc-kpi-destaque">
            <span class="calc-kpi-label">Endereço SLAAC</span>
            <strong class="calc-kpi-valor calc-kpi-mono">{e.enderecoSlaac}</strong>
            <span class="calc-kpi-nota">prefixo + Interface ID</span>
        </div>
        <div class="calc-kpi">
            <span class="calc-kpi-label">Interface ID (EUI-64)</span>
            <strong class="calc-kpi-valor calc-kpi-mono">{e.interfaceId}</strong>
            <span class="calc-kpi-nota">64 bits derivados do MAC</span>
        </div>
        <div class="calc-kpi">
            <span class="calc-kpi-label">MAC de origem</span>
            <strong class="calc-kpi-valor calc-kpi-mono">{e.mac}</strong>
        </div>
        <div class="calc-kpi">
            <span class="calc-kpi-label">Rede</span>
            <strong class="calc-kpi-valor calc-kpi-mono">{e.prefixoRede}</strong>
        </div>
    </div>
    <p class="calc-explicacao">
        <span class="material-symbols-outlined" aria-hidden="true">school</span> {e.passos}
    </p>
</div>
